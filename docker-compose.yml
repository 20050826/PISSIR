services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ferrovia
      POSTGRES_USER: ferrovia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrovia -d ferrovia"]
      interval: 5s
      retries: 12
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwords:/mosquitto/config/passwords:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/server.key
      KC_HOSTNAME: https://localhost:8443
      KC_HTTP_ENABLED: "false"
    volumes:
      - ./infra/keycloak/ferrovia-realm.json:/opt/keycloak/data/import/ferrovia-realm.json:ro
      - ./infra/mosquitto/certs/server.crt:/opt/keycloak/certs/server.crt:ro
      - ./infra/mosquitto/certs/server.key:/opt/keycloak/certs/server.key:ro
    ports:
      - "127.0.0.1:8443:8443"
volumes:
  pgdata:
  mosquitto_data:
